<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirection</title>
  <script>
    const targetBase = "https://jaquettes.pages.dev";
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;

    const match = path.match(/^\/Jaquettes\/([^\/]+_jpg)\/([^?#]+)$/i);

    if (match) {
      let folder = match[1].toLowerCase();
      const filePath = match[2];

      if (folder === "doc_jpg") {
        folder = "films_jpg";
      }

      if (
        !filePath.includes("..") &&
        !filePath.includes("\\") &&
        /\.(jpg|jpeg|png|webp)$/i.test(filePath)
      ) {
        const targetUrl =
          targetBase + "/" + folder + "/" + encodeURI(filePath) + search + hash;

        window.location.replace(targetUrl);
      }
    }
  </script>
</head>
<body>
  Redirection...
</body>
</html>
